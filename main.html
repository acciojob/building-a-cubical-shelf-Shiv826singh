<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building a Cubical Shelf</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="cube-container">

        <div id="cube">

            <!-- Front Face -->
            <div class="front">
                <div class="line-1"></div>
                <div class="line-2"></div>
                <div class="line-3"></div>
            </div>

            <!-- Back Face -->
            <div class="back">
                <div class="line-1"></div>
                <div class="line-2"></div>
                <div class="line-3"></div>
            </div>

            <!-- Left Face -->
            <div class="left">
                <div class="line-1"></div>
                <div class="line-2"></div>
                <div class="line-3"></div>
            </div>

            <!-- Right Face -->
            <div class="right">
                <div class="line-1"></div>
                <div class="line-2"></div>
                <div class="line-3"></div>
            </div>

            <!-- Top Face -->
            <div class="top">
                <div class="line-1"></div>
                <div class="line-2"></div>
                <div class="line-3"></div>
            </div>

            <!-- Bottom Face -->
            <div class="bottom">
                <div class="line-1"></div>
                <div class="line-2"></div>
                <div class="line-3"></div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
